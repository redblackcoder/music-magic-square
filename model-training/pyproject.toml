[project]
name = "cell-recognizer-training"
version = "0.1.0"
description = "Train a CNN to recognize hand-drawn digits and sums"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "pillow>=10.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "onnxscript>=0.1",
]

[tool.uv]
dev-dependencies = []
